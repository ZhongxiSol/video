<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Video en GitHub Pages</title>
   <style>
       * {
           box-sizing: border-box;
           margin: 0;
           padding: 0;
       }

       body {
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
           background-color: #0f172a;
           color: #f8fafc;
           display: flex;
           flex-direction: column;
           align-items: center;
           justify-content: center;
           min-height: 100vh;
           padding: 20px;
       }

       .container {
           width: 100%;
           max-width: 720px;
           background: #1e293b;
           border-radius: 12px;
           box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
           overflow: hidden;
           border: 1px solid #334155;
       }

       .video-wrapper {
           position: relative;
           width: 100%;
           background: #000;
           display: flex;
           justify-content: center;
           align-items: center;
       }

       video {
           width: 100%;
           max-height: 80vh;
           display: block;
           outline: none;
       }

       .content {
           padding: 20px;
       }

       h1 {
           font-size: 1.25rem;
           font-weight: 600;
           margin-bottom: 8px;
           color: #f1f5f9;
       }

       p {
           font-size: 0.95rem;
           color: #94a3b8;
           line-height: 1.5;
       }
   </style>
</head>
<body>

   <div class="container">
       <div class="video-wrapper">
           <!-- 
             Reemplaza 'tu-video.mp4' con la ruta o URL de tu archivo de video.
             Si subes el video al mismo repositorio, pon simplemente el nombre del archivo.
           -->
           <video controls autoplay muted loop playsinline>
               <source src="video.mp4" type="video/mp4">
               Tu navegador no soporta la reproducción de video.
           </video>
       </div>
       <div class="content">
           <h1>Mascota Programable de Escritorio</h1>
           <p>Zhongxi Solutions Mexico. Whatsapp 56 2711 0600</p>
          <br>
 <a href="https://docs.google.com/document/d/1OrUrt9xVkUo4EVIniR9xCR_lVt-BdKNprI7jz1DhI-s/edit?usp=share_link" class="link-pdf" target="_blank">Manual en PDF</a>
          <br>          
       </div>
   </div>

</body>
</html>
